<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delete Company Information</title>
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="p-8">
    <h1 class="text-2xl font-bold mb-6 text-center">Manage Companies</h1>
    
    <!-- Table to display companies -->
    <table class="min-w-full bg-white border rounded">
      <thead>
        <tr>
          <th class="px-4 py-2 border-b">Company Name</th>
          <th class="px-4 py-2 border-b">Action</th>
        </tr>
      </thead>
      <tbody id="companyTableBody">
        <!-- Rows will be populated by JavaScript -->
      </tbody>
    </table>

    <!-- Result or error message -->
    <div id="deleteResult" class="mt-4 text-center"></div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-md w-80">
      <h2 class="text-xl font-bold mb-4 text-center">Are you sure?</h2>
      <p class="text-center mb-4">Do you really want to delete this company? This action cannot be undone.</p>
      <div class="flex justify-between">
        <button
          id="cancelButton"
          class="w-1/2 mr-2 p-2 bg-gray-300 text-black rounded hover:bg-gray-400"
        >
          Cancel
        </button>
        <button
          id="confirmButton"
          class="w-1/2 ml-2 p-2 bg-red-500 text-white rounded hover:bg-red-600"
        >
          Confirm
        </button>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const companyTableBody = document.getElementById('companyTableBody');
    const confirmModal = document.getElementById('confirmModal');
    const confirmButton = document.getElementById('confirmButton');
    const cancelButton = document.getElementById('cancelButton');
    const deleteResult = document.getElementById('deleteResult');

    let companyToDelete = null; // Will store the selected company's name or ID

    // 1. Fetch all companies for the logged-in user when page loads
    window.addEventListener('DOMContentLoaded', async () => {
      await loadCompanies();
    });

    async function loadCompanies() {
      try {
        const response = await fetch('/apicomp/companies'); // GET request
        const companies = await response.json();

        // Clear the table body
        companyTableBody.innerHTML = '';

        // Populate the table with each company
        companies.forEach((company) => {
          // If your Company schema has a "generalInfo.companyName" field:
          const name = company.generalInfo?.companyName || 'Unnamed';

          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="px-4 py-2 border-b">${name}</td>
            <td class="px-4 py-2 border-b text-center">
              <button 
                class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600" 
                data-company-name="${name}"
              >
                Delete
              </button>
            </td>
          `;

          // Add event listener to "Delete" button
          const deleteButton = row.querySelector('button');
          deleteButton.addEventListener('click', () => {
            companyToDelete = name;
            confirmModal.classList.remove('hidden'); // show modal
          });

          companyTableBody.appendChild(row);
        });
      } catch (error) {
        console.error('Failed to load companies:', error);
        deleteResult.innerHTML = `<p class="text-red-500">Error fetching companies.</p>`;
      }
    }

    // Cancel deletion
    cancelButton.addEventListener('click', () => {
      confirmModal.classList.add('hidden');
      companyToDelete = null;
    });

    // Confirm deletion
    confirmButton.addEventListener('click', async () => {
      confirmModal.classList.add('hidden');
      if (!companyToDelete) return;
      
      deleteResult.innerHTML = ''; // Clear old messages

      // 2. Send DELETE (actually POST in your setup) request to the server
      try {
        const response = await fetch('/apicomp/company/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyName: companyToDelete }),
        });

        if (response.ok) {
          const data = await response.json();
          deleteResult.innerHTML = `<p class="text-green-500">${data.message}</p>`;
          await loadCompanies();
        } else {
          const errorData = await response.json();
          deleteResult.innerHTML = `<p class="text-red-500">Error: ${errorData.message || 'Failed to delete company'}</p>`;
        }
      } catch (error) {
        console.error('Delete request failed:', error);
        deleteResult.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
      } finally {
        companyToDelete = null;
      }
    });
  </script>
</body>
</html>
