<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Data Input</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-4xl">
        <h1 class="text-2xl font-bold mb-6 text-center">Manual Data Input</h1>
        <form id="manualInputForm" action="/apicomp/company" method="POST" class="space-y-6">
            <!-- General Information -->
            <div>
                <h2 class="text-lg font-semibold mb-4">General Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="companyName" class="block text-sm font-medium">Company Name</label>
                        <input type="text" name="generalInfo[companyName]" id="companyName" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="countryOfExchange" class="block text-sm font-medium">Country of Exchange</label>
                        <input type="text" name="generalInfo[countryOfExchange]" id="countryOfExchange" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="countryOfHeadquarters" class="block text-sm font-medium">Country of Headquarters</label>
                        <input type="text" name="generalInfo[countryOfHeadquarters]" id="countryOfHeadquarters" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="trbcIndustryGroup" class="block text-sm font-medium">TRBC Industry Group</label>
                        <input type="text" name="generalInfo[trbcIndustryGroup]" id="trbcIndustryGroup" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="cfTemplate" class="block text-sm font-medium">CF Template</label>
                        <input type="text" name="generalInfo[cfTemplate]" id="cfTemplate" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="consolidationBasis" class="block text-sm font-medium">Consolidation Basis</label>
                        <input type="text" name="generalInfo[consolidationBasis]" id="consolidationBasis" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="scaling" class="block text-sm font-medium">Scaling</label>
                        <input type="text" name="generalInfo[scaling]" id="scaling" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="period" class="block text-sm font-medium">Period</label>
                        <input type="text" name="generalInfo[period]" id="period" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="exportDate" class="block text-sm font-medium">Export Date</label>
                        <input type="date" name="generalInfo[exportDate]" id="exportDate" class="w-full p-2 border rounded">
                    </div>
                </div>
            </div>
            
            <!-- Financial Data -->
            <div>
                <h2 class="text-lg font-semibold mb-4">Financial Data</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="date" class="block text-sm font-medium">Date</label>
                        <input type="date" name="financialData[0][date]" id="date" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="standardizedCurrency" class="block text-sm font-medium">Standardized Currency</label>
                        <input type="text" name="financialData[0][standardizedCurrency]" id="standardizedCurrency" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="revenue" class="block text-sm font-medium">Revenue from Goods & Services</label>
                        <input type="number" step="any" name="financialData[0][revenueFromGoodsServices]" id="revenue" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="revenueTotal" class="block text-sm font-medium">Revenue from Business Activities - Total</label>
                        <input type="number" step="any" name="financialData[0][revenueFromBusinessActivitiesTotal]" id="revenueTotal" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="costOfRevenue" class="block text-sm font-medium">Cost of Operating Revenue</label>
                        <input type="number" step="any" name="financialData[0][costOfOperatingRevenue]" id="costOfRevenue" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="grossProfit" class="block text-sm font-medium">Gross Profit</label>
                        <input type="number" step="any" name="financialData[0][grossProfitIndustrials]" id="grossProfit" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="operatingExpenses" class="block text-sm font-medium">Operating Expenses - Total</label>
                        <input type="number" step="any" name="financialData[0][operatingExpensesTotal]" id="operatingExpenses" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="operatingProfit" class="block text-sm font-medium">Operating Profit</label>
                        <input type="number" step="any" name="financialData[0][operatingProfitBeforeNonRecurring]" id="operatingProfit" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="incomeBeforeTaxes" class="block text-sm font-medium">Income before Taxes</label>
                        <input type="number" step="any" name="financialData[0][incomeBeforeTaxes]" id="incomeBeforeTaxes" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="netIncome" class="block text-sm font-medium">Net Income after Tax</label>
                        <input type="number" step="any" name="financialData[0][netIncomeAfterTax]" id="netIncome" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label for="ebitda" class="block text-sm font-medium">EBITDA</label>
                        <input type="number" step="any" name="financialData[0][ebitda]" id="ebitda" class="w-full p-2 border rounded">
                    </div>
                </div>
            </div>
            
            <div class="text-center">
                <button type="submit" id="sbutton" class="p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Submit</button>
            </div>
        </form>
    </div>

    <!-- Modal -->
    <div id="successModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 text-center">
            <h2 class="text-xl font-bold mb-4">Success</h2>
            <p>Your company has been created successfully!</p>
            <button id="closeModal" class="mt-4 p-2 bg-blue-500 text-white rounded">Close</button>
        </div>
    </div>

    <script>
       
    </script>
</body>
</html>
