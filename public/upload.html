<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Excel File</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold mb-6 text-center">Upload Excel File</h1>
        <form id="uploadForm" action="/apicomp/company/upload" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div class="space-y-2">
                <label for="file" class="block text-left">Choose Excel File:</label>
                <input type="file" name="file" id="file" required class="w-full p-2 border rounded">
            </div>
            <button type="submit" class="w-full p-2 bg-blue-500 text-white rounded">Upload</button>
        </form>
    </div>

    <!-- Modal -->
    <div id="successModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 text-center">
            <h2 class="text-xl font-bold mb-4">Success</h2>
            <p>Your file has been uploaded successfully!</p>
            <button id="closeModal" class="mt-4 p-2 bg-blue-500 text-white rounded">Close</button>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(this);
    
            const response = await fetch(this.action, {
                method: this.method,
                body: formData
            });
    
            if (response.ok) {
                document.getElementById('successModal').classList.remove('hidden');
                document.getElementById('file').value = ''; // Clear the input field
            } else {
                alert('File upload failed. Please try again.');
            }
        });
    
        document.getElementById('closeModal').addEventListener('click', function() {
            window.location.href = "/getCompany";
        });
    </script>
    
</body>
</html>
