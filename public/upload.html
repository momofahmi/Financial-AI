<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .sidebar {
            width: 16rem;
        }
        .content {
            margin-left: 16rem;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex">
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar bg-white h-full fixed top-0 left-0 shadow-lg z-50 sidebar-expanded">
        <div class="flex items-center justify-between px-4 py-3 border-b bg-gray-100">
            <h2 class="text-lg font-bold text-gray-700 sidebar-text">Financial AI</h2>
            <button id="toggleSidebar" class="text-gray-600 hover:text-gray-800 text-xl">
                &#9776;
            </button>
        </div>
        <nav class="mt-6">
            <ul class="space-y-2">
                <li>
                    <a href="/dashboard" class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded">
                        <span>&#x1F3E0;</span> 
                        <span class="sidebar-text">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="/metrics" class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded">
                        <span>&#x1F4CA;</span>
                        <span class="sidebar-text">Operating Metrics</span>
                    </a>
                </li>
                <li>
                    <a href="/upload-file" class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded">
                        <span>&#x2B07;</span>
                        <span class="sidebar-text">Excel Upload</span>
                    </a>
                </li>
                <li>
                    <a href="/manual-input" class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded">
                        <span>&#x1F4DD;</span>
                        <span class="sidebar-text">Add Data Manually</span>
                    </a>
                </li>
                <li>
                    <a href="/getCompany" class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded">
                        <span>&#x1F4C8;</span>
                        <span class="sidebar-text">Companies Informations</span>
                    </a>
                </li>
                <li>
                    <a href="/deleteCompany" class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded">
                        <span>&#x1F5D1;</span>
                        <span class="sidebar-text">Delete Companies</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="p-4">
            <button
              id="logoutBtn"
              class="bg-red-500 text-white w-full py-3 rounded-lg hover:bg-red-600 font-bold"
            >
              Logout
            </button>
          </div>
    </div>

    <!-- Main Content -->
    <main class="content flex-1 p-5">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-bold">Excel Upload</h1>
            </div>
        </header>

        <!-- Upload Section -->
        <section class="bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">Upload File</h2>
            <p class="text-gray-600 mb-6">Upload your Excel file containing financial data for analysis.</p>
            <form id="uploadForm" action="/apicomp/company/upload" method="POST" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label for="file" class="block text-sm font-medium text-gray-700">Choose Excel File:</label>
                    <input type="file" name="file" id="file" required class="mt-2 w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full py-3 bg-gray-500 text-white rounded-lg shadow-md hover:bg-gray-600 transition duration-300 flex items-center justify-center space-x-2">
                    <span>&#x21A9;</span>
                    <span>Upload</span>
                </button>
            </form>
        </section>
    </main>
    <!-- Modal -->
    <div id="successModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 text-center">
            <h2 class="text-xl font-bold mb-4">Success</h2>
            <p>Your file has been uploaded successfully!</p>
            <button id="closeModal" class="mt-4 p-2 bg-blue-500 text-white rounded">Close</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logoutBtn');

        logoutBtn.addEventListener('click', async () => {
                try {
                    const response = await fetch('/api/auth/logout', {
                        method: 'POST',
                        credentials: 'include',
                    });
                    const data = await response.json();
                    if (data.success) {
                        window.location.href = '/login.html';
                    } else {
                        alert('Logout failed. Please try again.');
                    }
                } catch (error) {
                    console.error('Logout error:', error);
                    alert('An error occurred during logout. Please try again.');
                }
            });
        });

        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            
            const response = await fetch(this.action, {
                method: this.method,
                body: formData
            });
    
            if (response.ok) {
                document.getElementById('successModal').classList.remove('hidden');
                document.getElementById('file').value = ''; // Clear the input field
            } else {
                alert('File upload failed. Please try again.');
            }
        });
    
        document.getElementById('closeModal').addEventListener('click', function() {
            window.location.href = "/getCompany";
        });
    </script>

</body>
</html>
