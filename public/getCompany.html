<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Viewer</title>
  <!-- Tailwind CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <header class="mb-6">
    <h1 class="text-3xl font-bold text-center">Company List</h1>
  </header>

  <!-- Table for listing user companies -->
  <div class="bg-white shadow rounded mb-6">
    <table class="min-w-full border-collapse">
      <thead>
        <tr class="border-b">
          <th class="p-4 text-left">Company Name</th>
          <th class="p-4 text-center">Action</th>
        </tr>
      </thead>
      <tbody id="companyTableBody">
        <!-- Filled by JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- Section to display the selected company's details -->
  <div id="companyInfo" class="bg-white p-4 rounded shadow"></div>

  <script>
    const companyTableBody = document.getElementById('companyTableBody');
    const companyInfoDiv = document.getElementById('companyInfo');

    // On page load, fetch all companies
    window.addEventListener('DOMContentLoaded', loadCompanies);

    async function loadCompanies() {
      try {
        // 1) Fetch all companies from your backend
        // Adjust the endpoint as needed (e.g., "/apicomp/companies")
        const response = await fetch('/apicomp/companies');
        if (!response.ok) {
          throw new Error('Failed to fetch companies');
        }

        const companies = await response.json();
        companyTableBody.innerHTML = '';

        // 2) For each company, create a table row with a View button
        companies.forEach((company) => {
          // If your Company schema has generalInfo.companyName
          const name = company.generalInfo?.companyName || 'Unnamed';

          const row = document.createElement('tr');
          row.classList.add('border-b');

          row.innerHTML = `
            <td class="p-4">${name}</td>
            <td class="p-4 text-center">
              <button
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                data-company-name="${name}"
              >
                View
              </button>
            </td>
          `;

          // When "View" is clicked, fetch & display that company's info
          const viewButton = row.querySelector('button');
          viewButton.addEventListener('click', () => {
            fetchCompanyInfo(name);
          });

          companyTableBody.appendChild(row);
        });
      } catch (error) {
        console.error('Error loading companies:', error);
        companyTableBody.innerHTML = `
          <tr>
            <td colspan="2" class="p-4 text-red-500">Error loading companies</td>
          </tr>
        `;
      }
    }

    // Fetch a specific company's info by name
    async function fetchCompanyInfo(companyName) {
      try {
        // 3) Call your existing endpoint
        // e.g., "/apicomp/company/get?companyName=..."
        const response = await fetch(`/apicomp/company/get?companyName=${encodeURIComponent(companyName)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Failed to fetch company info');
        }

        // data.company should have the shape:
        // {
        //   generalInfo: { companyName, ... },
        //   financialData: [ { date, standardizedCurrency, ... }, ... ]
        // }
        const company = data.company;
        renderCompanyInfo(company);
      } catch (error) {
        console.error(error);
        companyInfoDiv.innerHTML = `<p class="text-red-500">${error.message}</p>`;
      }
    }

    // Render the selected company's info with a date dropdown
    function renderCompanyInfo(company) {
      // Clear existing content
      companyInfoDiv.innerHTML = '';

      // --- Header ---
      const title = document.createElement('h2');
      title.classList.add('text-xl', 'font-bold', 'mb-2');
      title.textContent = company.generalInfo.companyName;
      companyInfoDiv.appendChild(title);

      // --- General Info ---
      const infoHtml = `
        <p><strong>Country of Exchange:</strong> ${company.generalInfo.countryOfExchange || 'N/A'}</p>
        <p><strong>Country of Headquarters:</strong> ${company.generalInfo.countryOfHeadquarters || 'N/A'}</p>
        <p><strong>TRBC Industry Group:</strong> ${company.generalInfo.trbcIndustryGroup || 'N/A'}</p>
        <p><strong>CF Template:</strong> ${company.generalInfo.cfTemplate || 'N/A'}</p>
        <p><strong>Consolidation Basis:</strong> ${company.generalInfo.consolidationBasis || 'N/A'}</p>
        <p><strong>Scaling:</strong> ${company.generalInfo.scaling || 'N/A'}</p>
        <p><strong>Period:</strong> ${company.generalInfo.period || 'N/A'}</p>
        <p><strong>Export Date:</strong> ${company.generalInfo.exportDate || 'N/A'}</p>
      `;
      companyInfoDiv.insertAdjacentHTML('beforeend', infoHtml);

      // If no financial data, show a message
      if (!company.financialData || company.financialData.length === 0) {
        const noDataMsg = document.createElement('p');
        noDataMsg.classList.add('mt-4', 'text-gray-500');
        noDataMsg.textContent = 'No financial data available for this company.';
        companyInfoDiv.appendChild(noDataMsg);
        return;
      }

      // --- Financial Data Header ---
      const financialHeading = document.createElement('h3');
      financialHeading.classList.add('text-lg', 'font-semibold', 'mt-4');
      financialHeading.textContent = 'Financial Data:';
      companyInfoDiv.appendChild(financialHeading);

      // Container for dropdown & details
      const container = document.createElement('div');
      container.classList.add('mt-2');
      companyInfoDiv.appendChild(container);

      // Date label
      const dateLabel = document.createElement('label');
      dateLabel.setAttribute('for', 'dateSelector');
      dateLabel.classList.add('mr-2');
      dateLabel.textContent = 'Select Date:';
      container.appendChild(dateLabel);

      // Dropdown select
      const dateSelector = document.createElement('select');
      dateSelector.id = 'dateSelector';
      dateSelector.classList.add('p-2', 'border', 'rounded');
      container.appendChild(dateSelector);

      // Div to display the selected date's details
      const financialDetailsDiv = document.createElement('div');
      financialDetailsDiv.id = 'financialDetails';
      financialDetailsDiv.classList.add('mt-4');
      container.appendChild(financialDetailsDiv);

      // Populate the dropdown with each date
      company.financialData.forEach((entry, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = new Date(entry.date).toLocaleDateString();
        dateSelector.appendChild(option);
      });

      // Show details for the selected date
      function showFinancialData(entry) {
        financialDetailsDiv.innerHTML = `
          <p><strong>Date:</strong> ${new Date(entry.date).toLocaleDateString()}</p>
          <p><strong>Standardized Currency:</strong> ${entry.standardizedCurrency || 'N/A'}</p>
          <p><strong>Revenue from Goods & Services:</strong> ${entry.revenueFromGoodsServices ?? 0}</p>
          <p><strong>Revenue from Business Activities (Total):</strong> ${entry.revenueFromBusinessActivitiesTotal ?? 0}</p>
          <p><strong>Cost of Operating Revenue:</strong> ${entry.costOfOperatingRevenue ?? 0}</p>
          <p><strong>Gross Profit (Industrials):</strong> ${entry.grossProfitIndustrials ?? 0}</p>
          <p><strong>Operating Expenses (Total):</strong> ${entry.operatingExpensesTotal ?? 0}</p>
          <p><strong>Operating Profit before Non-Recurring Items:</strong> ${entry.operatingProfitBeforeNonRecurring ?? 0}</p>
          <p><strong>Income before Taxes:</strong> ${entry.incomeBeforeTaxes ?? 0}</p>
          <p><strong>Net Income after Tax:</strong> ${entry.netIncomeAfterTax ?? 0}</p>
          <p><strong>EBITDA:</strong> ${entry.ebitda ?? 0}</p>
        `;
      }

      // Listen for changes in the dropdown
      dateSelector.addEventListener('change', () => {
        const selectedIndex = dateSelector.value;
        const selectedEntry = company.financialData[selectedIndex];
        showFinancialData(selectedEntry);
      });

      // Show the first date's details by default
      showFinancialData(company.financialData[0]);
    }
  </script>
</body>
</html>
