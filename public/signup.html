<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold mb-6 text-center">Sign Up</h1>
        <form id="signupForm" class="space-y-4">
            <input type="text" id="username" placeholder="Username" required class="w-full p-2 border rounded">
            <input type="email" id="email" placeholder="Email" required class="w-full p-2 border rounded">
            <input type="password" id="password" placeholder="Password" required class="w-full p-2 border rounded">
            <button type="submit" class="w-full p-2 bg-blue-500 text-white rounded">Sign Up</button>
        </form>
        <p class="mt-4 text-center">
            Already have an account? <a href="/login.html" class="text-blue-500">Login</a>
        </p>
    </div>
    <script src="/js/signup.js"></script>
</body>
</html>
