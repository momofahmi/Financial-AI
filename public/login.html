<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- TailwindCSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .gradient-login {
        background: linear-gradient(90deg, #3b82f6, #2563eb);
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <!-- Card Container -->
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
      <!-- Logo / Header -->
      <div class="text-center mb-6">
        <img src="/images/file.png" alt="Logo" class="mx-auto w-16 h-16" />
        <h1 class="text-3xl font-bold text-gray-800">Financial AI</h1>
        <p class="text-gray-600">Login to continue</p>
      </div>
      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <input
          type="email"
          id="email"
          placeholder="Email"
          required
          class="w-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <input
          type="password"
          id="password"
          placeholder="Password"
          required
          class="w-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
          type="submit"
          class="w-full py-3 text-lg text-white font-medium rounded-lg gradient-login hover:opacity-90 transition duration-300"
        >
          Login
        </button>
      </form>
      <!-- Additional Options -->
      <p class="mt-4 text-center text-gray-600">
        Don't have an account?
        <a href="/signup.html" class="text-blue-500 hover:underline">Sign up</a>
      </p>
    </div>
    <!-- JavaScript -->
    <script src="/js/login.js"></script>
  </body>
</html>
