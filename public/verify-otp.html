<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold mb-6 text-center">Verify OTP via Email</h1>
        <form id="otpForm" class="space-y-4">
            <input type="text" id="otp" placeholder="Enter OTP" required class="w-full p-2 border rounded">
            <button type="submit" class="w-full p-2 bg-blue-500 text-white rounded">Verify OTP</button>
        </form>
    </div>
    <script src="/js/verify-otp.js"></script>
</body>
</html>
