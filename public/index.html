<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .background-image {
        background-image: url("images/pana.svg");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center bottom;
        background-color: #f9fafb; /* Light gray background */
      }
      .gradient-login {
        background: linear-gradient(90deg, #3b82f6, #2563eb);
      }
      .gradient-signup {
        background: linear-gradient(90deg, #10b981, #059669);
      }
    </style>
  </head>
  <body
    class="background-image min-h-screen flex items-center justify-center px-4 sm:px-8"
  >
    <div
      class="bg-white p-8 sm:p-12 rounded-2xl shadow-2xl flex flex-col md:flex-row items-center w-full max-w-6xl transform hover:scale-105 transition-all duration-300"
    >
      <!-- Left Section -->
      <div class="text-center md:text-left md:w-1/2 md:pr-12 mb-8 md:mb-0">
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800 mb-4">
          Welcome to <span class="text-blue-600">Financial AI</span>
        </h1>
        <p class="text-base md:text-lg text-gray-600 leading-relaxed">
          Empower your financial future with
          <span class="font-semibold">AI-driven insights</span> and make smarter
          decisions today.
        </p>
      </div>

      <!-- Right Section -->
      <div class="space-y-4 md:w-1/2 flex flex-col items-center">
        <a
          href="/login"
          class="block w-56 md:w-64 py-3 md:py-4 text-white text-center text-lg font-semibold rounded-lg gradient-login hover:opacity-90 hover:shadow-lg transition transform hover:scale-105"
        >
          Login
        </a>
        <a
          href="/signup"
          class="block w-56 md:w-64 py-3 md:py-4 text-white text-center text-lg font-semibold rounded-lg gradient-signup hover:opacity-90 hover:shadow-lg transition transform hover:scale-105"
        >
          Sign Up
        </a>
      </div>
    </div>
  </body>
</html>
