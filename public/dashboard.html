<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .sidebar {
        transition: width 0.3s ease-in-out;
        overflow: hidden;
      }
      .sidebar.collapsed {
        width: 4rem;
      }
      .sidebar-expanded {
        width: 16rem;
      }
      .content {
        transition: margin-left 0.3s ease-in-out;
      }
      .content.collapsed {
        margin-left: 4rem;
        width: calc(100% - 4rem);
      }
      .content-expanded {
        margin-left: 16rem;
        width: calc(100% - 16rem);
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex">
    <!-- Sidebar -->
    <div
      id="sidebar"
      class="sidebar bg-white h-full fixed top-0 left-0 shadow-lg z-50 sidebar-expanded"
    >
      <!-- Sidebar Header -->
      <div
        class="flex items-center justify-between px-4 py-4 border-b bg-gray-100"
      >
        <h2 class="text-lg font-bold text-gray-700 sidebar-text">
          Financial AI
        </h2>
        <button
          id="toggleSidebar"
          class="text-gray-600 hover:text-gray-800 text-xl"
        >
          &#9776;
        </button>
      </div>

      <!-- Sidebar Navigation -->
      <nav class="mt-6">
        <ul class="space-y-2">
          <li>
            <a
              href="/dashboard"
              class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded"
            >
              <span>&#x1F3E0;</span>
              <span class="sidebar-text">Dashboard</span>
            </a>
          </li>
          <li>
            <a
              href="/metrics"
              class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded"
            >
              <span>&#x1F4CA;</span>
              <span class="sidebar-text">Operating Metrics</span>
            </a>
          </li>
          <li>
            <a
              href="/upload-file"
              class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded"
            >
              <span>&#x2B07;</span>
              <span class="sidebar-text">Excel Upload</span>
            </a>
          </li>
          <li>
            <a
              href="/manual-input"
              class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded"
            >
              <span>&#x1F4DD;</span>
              <span class="sidebar-text">Add Data Manually</span>
            </a>
          </li>
          <li>
            <a
              href="/getCompany"
              class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded"
            >
              <span>&#x1F4C8;</span>
              <span class="sidebar-text">Companies Informations</span>
            </a>
          </li>
          <li>
            <a
              href="/deleteCompany"
              class="flex items-center space-x-2 px-4 py-2 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded"
            >
              <span>&#x1F5D1;</span>
              <span class="sidebar-text">Delete Companies</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="p-4">
        <button
          id="logoutBtn"
          class="bg-red-500 text-white w-full py-3 rounded-lg hover:bg-red-600 font-bold"
        >
          Logout
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div id="content" class="content content-expanded">
      <!-- Dashboard Content -->
      <main class="container mx-auto mt-8 p-4">
        <!-- Dashboard Header -->
        <div class="bg-gray-100 min-h-screen p-8">
          <h1 class="text-3xl font-bold mb-8">Admin Dashboard</h1>

          <!-- Companies Overview Section -->
          <section class="bg-white border p-10 shadow-md">
            <h2 class="text-xl font-bold mb-4">Companies Overview</h2>
            <p class="text-sm text-gray-500 mb-4">
              Select a company to view detailed information
            </p>

            <!-- Sector Filter Dropdown -->
            <div class="mb-4 flex items-center gap-x-4">
              <label for="sectorFilter" class="font-bold text-gray-700"
                >Filter by Sector:</label
              >
              <select
                id="sectorFilter"
                class="border p-2 rounded-lg w-48 shadow-sm"
              >
                <option value="">All Sectors</option>
                <!-- Options populated dynamically by JS -->
              </select>
            </div>

            <!-- Table -->
            <div class="bg-white shadow rounded mb-6">
              <table class="min-w-full border-collapse">
                <thead>
                  <tr class="border-b">
                    <th class="py-3 px-6">Company Name</th>

                    <th class="py-3 px-6">Action</th>
                  </tr>
                </thead>
                <tbody id="companyTableBody">
                  <!-- Filled by JavaScript -->
                </tbody>
              </table>
            </div>
          </section>

          <!-- Company Details Section -->

          <div
            id="companyInfo"
            class="bg-white p-4 rounded shadow hidden"
          ></div>
        </div>
      </main>
    </div>

    <script>
      const sidebar = document.getElementById("sidebar");
      const content = document.getElementById("content");
      const toggleSidebar = document.getElementById("toggleSidebar");

      // Sidebar toggle functionality
      toggleSidebar.addEventListener("click", () => {
        if (sidebar.classList.contains("sidebar-expanded")) {
          sidebar.classList.remove("sidebar-expanded");
          sidebar.classList.add("collapsed");
          content.classList.remove("content-expanded");
          content.classList.add("collapsed");
          document
            .querySelectorAll(".sidebar-text")
            .forEach((el) => el.classList.add("hidden"));
        } else {
          sidebar.classList.remove("collapsed");
          sidebar.classList.add("sidebar-expanded");
          content.classList.remove("collapsed");
          content.classList.add("content-expanded");
          document
            .querySelectorAll(".sidebar-text")
            .forEach((el) => el.classList.remove("hidden"));
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
