<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Dashboard</h1>
            <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
        </div>
    </nav>
    <main class="container mx-auto mt-8 p-4">
        <h2 class="text-xl font-semibold mb-4">Welcome to your dashboard!</h2>
        <p>This is a protected page. You can only see this if you're logged in.</p>
    </main>
    <div class="bg-white p-8 rounded-lg shadow-md w-full text-center mt-6">
        <h1 class="text-2xl font-bold mb-6">Welcome to the API</h1>
        <div class="flex space-x-4 justify-center">
            <a href="/manual-input" class="p-2 bg-blue-500 text-white rounded">Add Data Manually</a>
            <a href="/upload-file" class="p-2 bg-green-500 text-white rounded">Upload Excel</a>
            <a href="/getCompany" class="p-2 bg-yellow-500 text-white rounded">Get Company Info</a>
            <a href="/deleteCompany" class="p-2 bg-red-500 text-white rounded">Delete Company Info</a>
        </div>
    </div>
    <script src="/js/dashboard.js"></script>
</body>
</html>
